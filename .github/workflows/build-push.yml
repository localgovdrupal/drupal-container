name: Build and Push Multi-arch Image

on:
  push:
    branches:
      - php*
  workflow_dispatch:

jobs:
  build-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract base image tag from Dockerfile
        id: extract-tag
        run: |
          # Extract FROM line and convert php:8.3-apache → php8.3-apache
          BASE_IMAGE=$(grep -m1 '^FROM' Dockerfile | awk '{print $2}')
          TAG=$(echo "$BASE_IMAGE" | tr ':' '-' | tr '/' '-')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Extracted tag: $TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.extract-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
